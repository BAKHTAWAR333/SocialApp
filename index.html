<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Social Media App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .post-enter {
            opacity: 0;
            transform: translateY(-10px);
        }
        .post-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 300ms, transform 300ms;
        }
        .fade-in {
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .like-animation {
            animation: like 0.5s ease-in-out;
        }
        @keyframes like {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Authentication Section -->
    <div id="authSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h1 class="text-3xl font-bold text-center text-indigo-600 mb-2">SocialApp</h1>
            <p class="text-center text-gray-600 mb-6">Connect with friends and share your thoughts</p>
            
            <!-- Login Form -->
            <div id="loginForm">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login to Your Account</h2>
                <form id="loginFormElement">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="loginEmail">
                            Email
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
                               id="loginEmail" type="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="loginPassword">
                            Password
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" 
                               id="loginPassword" type="password" placeholder="Enter your password" required>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" 
                                type="submit">
                            Sign In
                        </button>
                    </div>
                </form>
                <p class="text-center text-gray-600">
                    Don't have an account? 
                    <button id="showSignup" class="text-indigo-600 font-bold hover:text-indigo-800">Sign up</button>
                </p>
            </div>
            
            <!-- Signup Form -->
            <div id="signupForm" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create Your Account</h2>
                <form id="signupFormElement">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="signupName">
                            Full Name
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
                               id="signupName" type="text" placeholder="Enter your full name" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="signupEmail">
                            Email
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
                               id="signupEmail" type="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="signupPassword">
                            Password
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" 
                               id="signupPassword" type="password" placeholder="Create a password" required>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" 
                                type="submit">
                            Create Account
                        </button>
                    </div>
                </form>
                <p class="text-center text-gray-600">
                    Already have an account? 
                    <button id="showLogin" class="text-indigo-600 font-bold hover:text-indigo-800">Sign in</button>
                </p>
            </div>
        </div>
    </div>

    <!-- Main App Section -->
    <div id="appSection" class="hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-indigo-600">SocialApp</h1>
                    <span id="welcomeUser" class="ml-4 text-gray-600"></span>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search posts..." 
                               class="border rounded-full py-2 px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-indigo-300 w-64">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                    <button id="themeToggle" class="p-2 rounded-full bg-gray-200 hover:bg-gray-300">
                        <i class="fas fa-moon text-gray-700"></i>
                    </button>
                    <button id="logoutBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <div class="container mx-auto px-4 py-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Left Sidebar - Create Post -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-xl shadow p-6 sticky top-24">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">Create a Post</h2>
                        <form id="postForm">
                            <div class="mb-4">
                                <textarea id="postContent" rows="4" 
                                          class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-300" 
                                          placeholder="What's on your mind?"></textarea>
                            </div>
                            <div class="mb-4">
                                <input type="text" id="postImageUrl" 
                                       class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-300" 
                                       placeholder="Add an image URL (optional)">
                            </div>
                            <div class="flex justify-between items-center mb-4">
                                <div class="flex space-x-2">
                                    <button type="button" class="emoji-btn p-2 rounded-full bg-gray-100 hover:bg-gray-200" data-emoji="😊">😊</button>
                                    <button type="button" class="emoji-btn p-2 rounded-full bg-gray-100 hover:bg-gray-200" data-emoji="❤️">❤️</button>
                                    <button type="button" class="emoji-btn p-2 rounded-full bg-gray-100 hover:bg-gray-200" data-emoji="😂">😂</button>
                                    <button type="button" class="emoji-btn p-2 rounded-full bg-gray-100 hover:bg-gray-200" data-emoji="👍">👍</button>
                                </div>
                                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">
                                    Post
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    <!-- Sorting Controls -->
                    <div class="bg-white rounded-xl shadow p-6 mt-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">Sort Posts</h2>
                        <div class="space-y-2">
                            <button class="sort-btn w-full text-left py-2 px-4 rounded-lg hover:bg-gray-100" data-sort="latest">
                                <i class="fas fa-clock mr-2"></i>Latest First
                            </button>
                            <button class="sort-btn w-full text-left py-2 px-4 rounded-lg hover:bg-gray-100" data-sort="oldest">
                                <i class="fas fa-history mr-2"></i>Oldest First
                            </button>
                            <button class="sort-btn w-full text-left py-2 px-4 rounded-lg hover:bg-gray-100" data-sort="most-liked">
                                <i class="fas fa-heart mr-2"></i>Most Liked
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Main Feed -->
                <div class="lg:col-span-2">
                    <div id="postsContainer" class="space-y-6">
                        <!-- Posts will be dynamically added here -->
                    </div>
                    
                    <!-- Empty State -->
                    <div id="emptyState" class="text-center py-12">
                        <i class="fas fa-feather-alt text-6xl text-gray-300 mb-4"></i>
                        <h3 class="text-xl font-bold text-gray-500 mb-2">No posts yet</h3>
                        <p class="text-gray-500">Be the first to share something with your friends!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Post Modal -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20 hidden">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Edit Post</h2>
            <form id="editForm">
                <input type="hidden" id="editPostId">
                <div class="mb-4">
                    <textarea id="editPostContent" rows="4" 
                              class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-300"></textarea>
                </div>
                <div class="mb-4">
                    <input type="text" id="editPostImageUrl" 
                           class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-300" 
                           placeholder="Image URL">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelEdit" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
                        Cancel
                    </button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">
                        Update Post
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State management
        let currentUser = null;
        let posts = [];
        let currentSort = 'latest';
        let darkMode = false;

        // DOM Elements
        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginFormElement = document.getElementById('loginFormElement');
        const signupFormElement = document.getElementById('signupFormElement');
        const showSignupBtn = document.getElementById('showSignup');
        const showLoginBtn = document.getElementById('showLogin');
        const welcomeUser = document.getElementById('welcomeUser');
        const logoutBtn = document.getElementById('logoutBtn');
        const postForm = document.getElementById('postForm');
        const postsContainer = document.getElementById('postsContainer');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const sortButtons = document.querySelectorAll('.sort-btn');
        const themeToggle = document.getElementById('themeToggle');
        const editModal = document.getElementById('editModal');
        const editForm = document.getElementById('editForm');
        const cancelEditBtn = document.getElementById('cancelEdit');
        const emojiButtons = document.querySelectorAll('.emoji-btn');

        // Initialize app
        function init() {
            // Check if user is logged in
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showApp();
            }

            // Load posts from localStorage
            const savedPosts = localStorage.getItem('posts');
            if (savedPosts) {
                posts = JSON.parse(savedPosts);
                renderPosts();
            }

            // Event listeners
            loginFormElement.addEventListener('submit', handleLogin);
            signupFormElement.addEventListener('submit', handleSignup);
            showSignupBtn.addEventListener('click', () => toggleAuthForms('signup'));
            showLoginBtn.addEventListener('click', () => toggleAuthForms('login'));
            logoutBtn.addEventListener('click', handleLogout);
            postForm.addEventListener('submit', handlePostSubmit);
            searchInput.addEventListener('input', handleSearch);
            sortButtons.forEach(btn => {
                btn.addEventListener('click', () => handleSort(btn.dataset.sort));
            });
            themeToggle.addEventListener('click', toggleTheme);
            editForm.addEventListener('submit', handleEditSubmit);
            cancelEditBtn.addEventListener('click', () => editModal.classList.add('hidden'));
            
            // Add emoji buttons functionality
            emojiButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const emoji = btn.getAttribute('data-emoji');
                    const postContent = document.getElementById('postContent');
                    postContent.value += emoji;
                    postContent.focus();
                });
            });
        }

        // Authentication functions
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            // Simple validation (in a real app, this would be done on the server)
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                showApp();
            } else {
                alert('Invalid email or password');
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            
            // Check if user already exists
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            if (users.find(u => u.email === email)) {
                alert('User with this email already exists');
                return;
            }
            
            // Create new user
            const newUser = { id: Date.now().toString(), name, email, password };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            currentUser = newUser;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            showApp();
        }

        function toggleAuthForms(form) {
            if (form === 'signup') {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            authSection.classList.remove('hidden');
            appSection.classList.add('hidden');
        }

        function showApp() {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            welcomeUser.textContent = `Welcome, ${currentUser.name}`;
            renderPosts();
        }

        // Post functions
        function handlePostSubmit(e) {
            e.preventDefault();
            const content = document.getElementById('postContent').value.trim();
            const imageUrl = document.getElementById('postImageUrl').value.trim();
            
            if (!content) {
                alert('Please write something to post');
                return;
            }
            
            const newPost = {
                id: Date.now().toString(),
                userId: currentUser.id,
                userName: currentUser.name,
                content,
                imageUrl: imageUrl || null,
                timestamp: new Date().toISOString(),
                likes: 0,
                liked: false,
                comments: []
            };
            
            posts.unshift(newPost);
            savePosts();
            renderPosts();
            
            // Reset form
            postForm.reset();
        }

        function handleEditSubmit(e) {
            e.preventDefault();
            const postId = document.getElementById('editPostId').value;
            const content = document.getElementById('editPostContent').value.trim();
            const imageUrl = document.getElementById('editPostImageUrl').value.trim();
            
            const postIndex = posts.findIndex(p => p.id === postId);
            if (postIndex !== -1) {
                posts[postIndex].content = content;
                posts[postIndex].imageUrl = imageUrl || null;
                savePosts();
                renderPosts();
            }
            
            editModal.classList.add('hidden');
        }

        function handleLike(postId) {
            const postIndex = posts.findIndex(p => p.id === postId);
            if (postIndex !== -1) {
                if (posts[postIndex].liked) {
                    posts[postIndex].likes--;
                    posts[postIndex].liked = false;
                } else {
                    posts[postIndex].likes++;
                    posts[postIndex].liked = true;
                }
                savePosts();
                renderPosts();
                
                // Add animation to the like button
                const likeBtn = document.querySelector(`[data-post-id="${postId}"] .like-btn`);
                likeBtn.classList.add('like-animation');
                setTimeout(() => {
                    likeBtn.classList.remove('like-animation');
                }, 500);
            }
        }

        function handleDelete(postId) {
            if (confirm('Are you sure you want to delete this post?')) {
                posts = posts.filter(p => p.id !== postId);
                savePosts();
                renderPosts();
            }
        }

        function openEditModal(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                document.getElementById('editPostId').value = postId;
                document.getElementById('editPostContent').value = post.content;
                document.getElementById('editPostImageUrl').value = post.imageUrl || '';
                editModal.classList.remove('hidden');
            }
        }

        // Search and sort functions
        function handleSearch() {
            renderPosts();
        }

        function handleSort(sortType) {
            currentSort = sortType;
            
            // Update active sort button
            sortButtons.forEach(btn => {
                if (btn.dataset.sort === sortType) {
                    btn.classList.add('bg-indigo-100', 'text-indigo-700');
                } else {
                    btn.classList.remove('bg-indigo-100', 'text-indigo-700');
                }
            });
            
            renderPosts();
        }

        function toggleTheme() {
            darkMode = !darkMode;
            document.body.classList.toggle('dark', darkMode);
            
            const icon = themeToggle.querySelector('i');
            if (darkMode) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                themeToggle.classList.remove('bg-gray-200');
                themeToggle.classList.add('bg-gray-700');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                themeToggle.classList.remove('bg-gray-700');
                themeToggle.classList.add('bg-gray-200');
            }
        }

        // Render functions
        function renderPosts() {
            const searchTerm = searchInput.value.toLowerCase();
            
            // Filter and sort posts
            let filteredPosts = posts.filter(post => 
                post.content.toLowerCase().includes(searchTerm) || 
                post.userName.toLowerCase().includes(searchTerm)
            );
            
            // Apply sorting
            switch(currentSort) {
                case 'latest':
                    filteredPosts.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    break;
                case 'oldest':
                    filteredPosts.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                    break;
                case 'most-liked':
                    filteredPosts.sort((a, b) => b.likes - a.likes);
                    break;
            }
            
            // Render posts
            postsContainer.innerHTML = '';
            
            if (filteredPosts.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            filteredPosts.forEach(post => {
                const postElement = createPostElement(post);
                postsContainer.appendChild(postElement);
            });
        }

        function createPostElement(post) {
            const postDiv = document.createElement('div');
            postDiv.className = 'bg-white rounded-xl shadow p-6 fade-in';
            postDiv.setAttribute('data-post-id', post.id);
            
            const timeAgo = getTimeAgo(post.timestamp);
            
            postDiv.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold mr-3">
                            ${post.userName.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800">${post.userName}</h3>
                            <p class="text-sm text-gray-500">${timeAgo}</p>
                        </div>
                    </div>
                    ${post.userId === currentUser.id ? `
                    <div class="relative">
                        <button class="post-options-btn p-2 rounded-full hover:bg-gray-100">
                            <i class="fas fa-ellipsis-v text-gray-500"></i>
                        </button>
                        <div class="absolute right-0 mt-1 w-32 bg-white rounded-md shadow-lg py-1 z-10 hidden">
                            <button class="edit-post-btn block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-post-id="${post.id}">
                                <i class="fas fa-edit mr-2"></i>Edit
                            </button>
                            <button class="delete-post-btn block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100" data-post-id="${post.id}">
                                <i class="fas fa-trash mr-2"></i>Delete
                            </button>
                        </div>
                    </div>
                    ` : ''}
                </div>
                <div class="mb-4">
                    <p class="text-gray-800 whitespace-pre-line">${post.content}</p>
                </div>
                ${post.imageUrl ? `
                <div class="mb-4">
                    <img src="${post.imageUrl}" alt="Post image" class="rounded-lg w-full max-h-96 object-cover">
                </div>
                ` : ''}
                <div class="flex justify-between items-center pt-4 border-t">
                    <button class="like-btn flex items-center text-gray-500 hover:text-red-500 ${post.liked ? 'text-red-500' : ''}" data-post-id="${post.id}">
                        <i class="fas fa-heart mr-2"></i>
                        <span>${post.likes}</span>
                    </button>
                    <button class="comment-btn flex items-center text-gray-500 hover:text-indigo-500">
                        <i class="fas fa-comment mr-2"></i>
                        <span>${post.comments.length}</span>
                    </button>
                </div>
            `;
            
            // Add event listeners
            const likeBtn = postDiv.querySelector('.like-btn');
            likeBtn.addEventListener('click', () => handleLike(post.id));
            
            if (post.userId === currentUser.id) {
                const optionsBtn = postDiv.querySelector('.post-options-btn');
                const optionsMenu = postDiv.querySelector('.absolute');
                
                optionsBtn.addEventListener('click', () => {
                    optionsMenu.classList.toggle('hidden');
                });
                
                const editBtn = postDiv.querySelector('.edit-post-btn');
                editBtn.addEventListener('click', () => openEditModal(post.id));
                
                const deleteBtn = postDiv.querySelector('.delete-post-btn');
                deleteBtn.addEventListener('click', () => handleDelete(post.id));
                
                // Close options menu when clicking elsewhere
                document.addEventListener('click', (e) => {
                    if (!postDiv.contains(e.target)) {
                        optionsMenu.classList.add('hidden');
                    }
                });
            }
            
            return postDiv;
        }

        function getTimeAgo(timestamp) {
            const now = new Date();
            const postTime = new Date(timestamp);
            const diffInSeconds = Math.floor((now - postTime) / 1000);
            
            if (diffInSeconds < 60) {
                return 'Just now';
            } else if (diffInSeconds < 3600) {
                const minutes = Math.floor(diffInSeconds / 60);
                return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
            } else if (diffInSeconds < 86400) {
                const hours = Math.floor(diffInSeconds / 3600);
                return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            } else {
                const days = Math.floor(diffInSeconds / 86400);
                return `${days} day${days > 1 ? 's' : ''} ago`;
            }
        }

        function savePosts() {
            localStorage.setItem('posts', JSON.stringify(posts));
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
